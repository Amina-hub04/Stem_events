name: Auto-refresh STEM events

on:
  schedule:
    # Runs every day at 06:00 UTC (11:00 AM Pakistan time). Adjust as needed.
    - cron: "0 6 * * *"
  workflow_dispatch:  # lets you trigger it manually from the Actions tab too

permissions:
  contents: write  # needed so the workflow can commit events_output.json back to the repo

jobs:
  refresh-events:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py

      - name: Commit updated events_output.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add events_output.json
          git diff --staged --quiet && echo "No changes to commit" || git commit -m "Auto-refresh events_output.json"
          git push
